name: Niki
options:
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  AsyncXPCConnection:
    url: https://github.com/ChimeHQ/AsyncXPCConnection
    exactVersion: "1.3.0"
  Defaults:
    url: https://github.com/sindresorhus/Defaults
    exactVersion: "9.0.6"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: "2.4.0"
  LaunchAtLoginModern:
    url: https://github.com/sindresorhus/LaunchAtLogin-Modern
    exactVersion: "1.1.0"
  Lottie:
    url: https://github.com/airbnb/lottie-spm.git
    exactVersion: "4.5.2"
  MacroVisionKit:
    url: https://github.com/TheBoredTeam/MacroVisionKit
    exactVersion: "0.2.0"
  Pow:
    url: https://github.com/EmergeTools/Pow
    exactVersion: "1.0.6"
  SkyLightWindow:
    url: https://github.com/Lakr233/SkyLightWindow
    exactVersion: "1.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.1"
  SwiftCollections:
    url: https://github.com/apple/swift-collections.git
    exactVersion: "1.3.0"
  SwiftSyntax:
    url: https://github.com/swiftlang/swift-syntax
    exactVersion: "602.0.0"
  SwiftUIIntrospect:
    url: https://github.com/siteline/swiftui-introspect
    exactVersion: "1.3.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: NO

targets:
  Niki:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "**/.DS_Store"
      - path: mediaremote-adapter/mediaremote-adapter.pl
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niki.app
        PRODUCT_NAME: Niki
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Niki
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Niki uses the microphone to transcribe voice prompts."
        INFOPLIST_KEY_NSCameraUsageDescription: "Niki uses the camera for webcam features."
        INFOPLIST_KEY_NSCalendarsUsageDescription: "Niki reads your calendar to show upcoming events."
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        CODE_SIGN_ENTITLEMENTS: Sources/Notch/Niki.entitlements
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/mediaremote-adapter"
    dependencies:
      - package: AsyncXPCConnection
        product: AsyncXPCConnection
      - package: Defaults
      - package: KeyboardShortcuts
      - package: LaunchAtLoginModern
        product: LaunchAtLogin
      - package: Lottie
        product: Lottie
      - package: MacroVisionKit
        product: MacroVisionKit
      - package: Pow
        product: Pow
      - package: SkyLightWindow
        product: SkyLightWindow
      - package: Sparkle
        product: Sparkle
      - package: SwiftCollections
        product: Collections
      - package: SwiftSyntax
        product: SwiftSyntax
      - package: SwiftUIIntrospect
        product: SwiftUIIntrospect
      - target: NikiXPCHelper
        embed: true
        codeSign: true
      - framework: mediaremote-adapter/MediaRemoteAdapter.framework
        embed: true

  NikiXPCHelper:
    type: xpc-service
    platform: macOS
    sources:
      - path: NikiXPCHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niki.NikiXPCHelper
        PRODUCT_NAME: NikiXPCHelper
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ENTITLEMENTS: NikiXPCHelper/NikiXPCHelper.entitlements
    dependencies:
      - package: AsyncXPCConnection
        product: AsyncXPCConnection
