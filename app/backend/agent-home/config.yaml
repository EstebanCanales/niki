# Config del runtime del agente de Niki.
#
# Proveedor: por ahora kimi-coding, igual que el Hermes original — es el que sabe
# hablar el formato de herramientas que Hermes espera. El proveedor
# "openai-compatible" que agregamos al fork funciona y está probado para generar
# texto; para el bucle de agente con herramientas, ver la nota al final.
model:
  default: kimi-k2.5
  provider: kimi-coding
  base_url: https://api.moonshot.ai/v1
  context_length: 256000
providers: {}

# Recorte medido: con todo por defecto son 30 herramientas y ~21.500 tokens fijos por
# turno. Con estos toolsets son 7 herramientas y ~4.200. El uso real en 159 sesiones
# fue terminal 477, read_file 110, execute_code 20, search_files 12, process 6.
# El API server NO lee esta clave: resuelve sus herramientas desde
# platform_toolsets.api_server (ver hermes_cli/tools_config.py:_get_platform_tools).
# Se deja igual para el resto de superficies.
toolsets:
- terminal
- file
- code_execution

# Este es el que manda para el camino que usa Niki.
platform_toolsets:
  api_server:
  - terminal
  - file
  - code_execution
  # Internet. Sin un plugin de búsqueda activo estas dos herramientas NO se publican —
  # no fallan, directamente no existen. Ver plugins.enabled más abajo.
  - web
  # Baratas y cambian cómo se comporta: llevar la cuenta en tareas largas (+344) y
  # preguntar en vez de adivinar (+323).
  - todo
  - clarify
  # image_gen queda AFUERA aunque cargue y cueste solo 205 tokens: al invocarla falla
  # con "falta configurar FAL_KEY". Una herramienta que el modelo anuncia, intenta y
  # pierde el turno es peor que no tenerla. Vuelve si algún día hay FAL_KEY o
  # OPENAI_API_KEY.
  # Recordar hechos entre sesiones (+902). Es la memoria del runtime en agent-home,
  # distinta de la de Upstash, que sigue caída.
  - memory
  # Rutinas propias. La herramienta está condicionada a HERMES_GATEWAY_SESSION, que
  # pone el arranque en agent-runtime.service.ts (tools/cronjob_tools.py:665).
  - cronjob
  # Spotify: 7 herramientas por 1.037 tokens, con la credencial ya migrada.
  - spotify
  # Navegador de verdad: navegar, hacer clic, escribir, leer la página. Sus 10
  # herramientas cargan en el esquema AUNQUE falte el motor, así que solo entra con
  # `agent-browser` instalado y Chromium bajado — si no, serían diez herramientas que
  # el modelo anuncia y fallan.
  - browser
  # Las skills cuestan, y se midió cuánto antes de decidir:
  #   sin skills          7 herramientas →  4.189 tokens (y 93 skills inservibles)
  #   con 37 skills      10 herramientas →  7.034
  #   con las 93         10 herramientas →  8.487
  # Recortar 56 skills ahorraba 1.453 tokens: el grueso son los esquemas de las tres
  # herramientas, no el índice. No compensa mantener una lista de exclusiones ni perder
  # capacidades en silencio. Aun con todas, 8.487 sigue siendo la mitad de los 16.238
  # que costaba el turno antes.
  - skills

# Dónde trabaja el agente. Sin esto la herramienta terminal arranca en el home del
# usuario y "leé package.json" contesta que no existe — parada fuera del proyecto.
# El gateway puentea esta clave a TERMINAL_CWD (no ponerla en .env: avisa y la ignora).
terminal:
  cwd: /Users/estebancanales/Work/agente

agent:
  max_turns: 20
  reasoning_effort: medium

# Para usar OpenAI (o cualquier endpoint compatible) en vez de Kimi:
#   model.provider: openai-compatible
#   model.base_url: https://api.openai.com/v1
#   y OPENAI_API_KEY (o OPENAI_COMPATIBLE_API_KEY) en el entorno.
#
# Con Groq (https://api.groq.com/openai/v1) la generación de texto anda, pero el bucle
# de agente no: llama-3.3-70b falla al emitir llamadas a función en el formato de
# Hermes, gpt-oss exige un campo "reasoning" que Hermes no envía, y el tramo gratuito
# tiene un tope de 12.000 tokens por minuto que un turno con herramientas se come solo.

# Política del terminal — no hizo falta escribir ningún guardia: el fork ya trae dos
# niveles, verificados en tools/approval.py.
#
#   libre        open -a Canva, ls, git status, cat, echo…  corren sin preguntar,
#                que es el flujo al que Esteban está acostumbrado.
#   aprobación   52 patrones marcados (chmod -R 777, curl|sh, dd…) emiten un
#                approval.request y esperan. Verificado en vivo: el agente intentó
#                chmod -R 777 sobre un directorio de prueba, el guardia lo frenó y los
#                permisos quedaron intactos.
#   bloqueado    12 patrones HARDLINE que no se saltean ni con yolo: rm -rf sobre raíz,
#                directorios de sistema o el home, mkfs, dd a dispositivo, fork bomb,
#                kill -9 -1, shutdown/reboot.
#
# `yolo` queda apagado a propósito. Encenderlo saltea los 52 de aprobación (los 12
# HARDLINE siguen firmes) y tiene sentido cuando el modelo delibera mucho; con modelos
# rápidos, menos.

# Control de la máquina, por MCP. El runtime trae terminal y archivos pero no puede mover
# el mouse, tipear ni capturar pantalla: eso necesita el helper de entrada del backend de
# Niki. Se expone por MCP en vez de duplicar 24 capacidades dentro del fork, que sería
# código nuestro en algo que queremos poder rebasar contra upstream.
mcp_servers:
  niki:
    command: node
    args:
    - /Users/estebancanales/Work/agente/app/backend/scripts/mcp-niki.mjs
    enabled: true

# Plugins. Vienen todos apagados de fábrica; el buscador es uno de ellos, y por eso
# `web` no publicaba nada aunque el toolset estuviera puesto: `_get_backend()` devolvía
# "ddgs" como nombre, pero no había ningún proveedor registrado que lo implementara.
plugins:
  enabled:
  - web/ddgs
  - spotify

# Compactación de contexto. Cuando la conversación pasa el 50% del contexto, el runtime
# resume lo viejo y sigue. Eso no lo hace el modelo principal: usa un modelo "auxiliar"
# aparte, y Niki no tenía ninguno. El log lo decía textual:
#
#   Auxiliary auto-detect: no provider available (tried: openrouter, nous, local/custom,
#   api-key). Compression, summarization, and memory flush will not work.
#
# El motivo: la resolución automática busca una clave de API en el entorno, y los
# proveedores por suscripción no tienen ninguna — se autentican por OAuth. Con
# kimi-coding de principal (lo que hay hoy) la compactación queda muerta, y una charla
# larga termina en "413 payload too large. Cannot compress further.", que es un turno
# perdido, no una degradación.
#
# Se elige codex y no groq: Groq en plan gratis tiene un techo de doce mil tokens por
# minuto, y el bloque a resumir es más grande que eso por definición — medido, 413 con
# 20.558 tokens pedidos. Codex resuelve por OAuth sin clave de entorno y aguanta el
# tamaño. Comprimir pasa pocas veces por sesión, así que los 16 segundos que tarda no se
# notan en la conversación.
auxiliary:
  compression:
    provider: codex
    model: gpt-5.6-sol
    timeout: 180

# El umbral de compactación queda en el 0,50 de fábrica, y esto es por qué — para no
# volver a discutirlo dentro de dos meses.
#
# Con Kimi (256k de contexto) compacta a los 128.000 tokens. Bajarlo tiene un piso duro:
# `threshold_tokens = max(contexto * umbral, MINIMUM_CONTEXT_LENGTH)` con el mínimo en
# 64.000 (agent/model_metadata.py:133), así que 64k es lo más abajo que se puede llegar,
# ponga uno el porcentaje que ponga.
#
# Y no conviene. Medido en un run real:
#
#     110.478 tokens de contexto  →  9,1 s la primera llamada
#      66.013 tokens de contexto  →  6,9 s
#     compactar 154k → 57k        →   49 s
#
# O sea: bajar el umbral a la mitad ahorra unos dos segundos por turno y duplica la
# frecuencia de una pausa de cuarenta y nueve segundos. Mal negocio para una conversación
# hablada. Se deja como está.
#
# La otra válvula, `hygiene_hard_message_limit: 400`, no aplica a Niki y no hace falta.
# Existe para romper el círculo en el que la API se desconecta, no reporta cuántos tokens
# usó, y sin ese dato nunca se compacta. Nuestro camino no depende de ese dato:
# `Preflight compression` (agent/conversation_loop.py:436) estima el tamaño del historial,
# el prompt y el esquema de herramientas antes de cada llamada. Probado: 422 mensajes
# cortos no la disparan —y está bien, son pocos tokens— y 661 mensajes de 154.000 tokens
# sí, y compactaron a 183 mensajes y 57.336 tokens.
compression:
  threshold: 0.50
